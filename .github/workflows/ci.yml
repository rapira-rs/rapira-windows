name: CI
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  RUST_BACKTRACE: "1"

jobs:
  prepare:
    runs-on: windows-latest
    outputs:
      php84: ${{ steps.php84.outputs.spec }}
      php85: ${{ steps.php85.outputs.spec }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt
      - name: Format
        run: cargo fmt --all --check
      - id: php84
        shell: pwsh
        run: |
          $spec = ./ci/resolve-php.ps1 -Branch 8.4
          "spec=$spec" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
      - id: php85
        shell: pwsh
        run: |
          $spec = ./ci/resolve-php.ps1 -Branch 8.5
          "spec=$spec" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8

  test:
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
        arch: [x86_64, arm64]
        include:
          - php: '8.4'
            spec: ${{ needs.prepare.outputs.php84 }}
          - php: '8.5'
            spec: ${{ needs.prepare.outputs.php85 }}
          - arch: x86_64
            runner: windows-latest
          - arch: arm64
            runner: windows-11-vs2026-arm
    name: ${{ matrix.arch }} PHP ${{ matrix.php }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Set PHP install path
        run: |
          $path = Join-Path $env:RUNNER_TEMP 'php-${{ matrix.arch }}/${{ fromJSON(matrix.spec).php_version }}'
          "PHP_INSTALL_DIR=$path" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Restore native PHP
        id: php-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PHP_INSTALL_DIR }}
          key: ${{ fromJSON(matrix.spec).source_cache_key }}-${{ matrix.arch }}-${{ hashFiles('ci/build-php.ps1', 'ci/build-common.ps1', 'ci/php-*', 'ci/*dependencies*', 'ci/windows-extensions.txt') }}
      - name: Restore ARM64 dependencies
        if: matrix.arch == 'arm64' && steps.php-cache.outputs.cache-hit != 'true'
        id: deps-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/rapira-php-dependencies/arm64
          key: php-dependencies-arm64-${{ hashFiles('ci/build-dependencies.ps1', 'ci/build-common.ps1', 'ci/php-dependencies-arm64.json') }}
      - name: Build ARM64 dependencies
        if: matrix.arch == 'arm64' && steps.php-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: ./ci/build-dependencies.ps1 -InstallDirectory "$env:RUNNER_TEMP\rapira-php-dependencies\arm64"
      - name: Save ARM64 dependencies
        if: matrix.arch == 'arm64' && steps.php-cache.outputs.cache-hit != 'true' && steps.deps-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/rapira-php-dependencies/arm64
          key: ${{ steps.deps-cache.outputs.cache-primary-key }}
      - name: Build native PHP
        shell: pwsh
        run: |
          ./ci/build-php.ps1 `
            -PhpVersion '${{ fromJSON(matrix.spec).php_version }}' `
            -SourceUrl '${{ fromJSON(matrix.spec).source_url }}' `
            -SourceSha256 '${{ fromJSON(matrix.spec).source_sha256 }}' `
            -InstallDirectory $env:PHP_INSTALL_DIR
      - name: Save native PHP
        if: steps.php-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PHP_INSTALL_DIR }}
          key: ${{ steps.php-cache.outputs.cache-primary-key }}
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-on-failure: true
          key: ${{ matrix.arch }}-php-${{ fromJSON(matrix.spec).php_version }}
      - name: Clippy
        run: ./dev.ps1 -Task clippy -Devel $env:PHP_DEVEL_DIR -Runtime $env:PHP_RUNTIME
      - name: Workspace tests
        run: ./dev.ps1 -Task test -Devel $env:PHP_DEVEL_DIR -Runtime $env:PHP_RUNTIME
      - name: End-to-end tests
        run: ./dev.ps1 -Task test_e2e -Release:('${{ matrix.arch }}' -eq 'x86_64') -Devel $env:PHP_DEVEL_DIR -Runtime $env:PHP_RUNTIME
      - name: Release bundle
        run: |
          ./dev.ps1 -Task build -Release -Devel $env:PHP_DEVEL_DIR -Runtime $env:PHP_RUNTIME
          $target = if ('${{ matrix.arch }}' -eq 'arm64') { 'aarch64-pc-windows-msvc' } else { 'x86_64-pc-windows-msvc' }
          ./ci/package.ps1 -Binary "target\$target\release\rapira.exe" -PhpInstall $env:PHP_INSTALL_DIR -Destination "$env:RUNNER_TEMP\bundle"

  coverage:
    needs: prepare
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Set PHP install path
        run: |
          "PHP_INSTALL_DIR=$env:RUNNER_TEMP\php-x86_64\${{ fromJSON(needs.prepare.outputs.php85).php_version }}" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Restore native PHP
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PHP_INSTALL_DIR }}
          key: ${{ fromJSON(needs.prepare.outputs.php85).source_cache_key }}-x86_64-${{ hashFiles('ci/build-php.ps1', 'ci/build-common.ps1', 'ci/php-*', 'ci/*dependencies*', 'ci/windows-extensions.txt') }}
      - name: Build native PHP 8.5
        shell: pwsh
        run: |
          ./ci/build-php.ps1 `
            -PhpVersion '${{ fromJSON(needs.prepare.outputs.php85).php_version }}' `
            -SourceUrl '${{ fromJSON(needs.prepare.outputs.php85).source_url }}' `
            -SourceSha256 '${{ fromJSON(needs.prepare.outputs.php85).source_sha256 }}' `
            -InstallDirectory $env:PHP_INSTALL_DIR
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-llvm-cov@0.9.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-on-failure: true
          key: coverage-php-${{ fromJSON(needs.prepare.outputs.php85).php_version }}
      - name: Generate coverage
        run: ./dev.ps1 -Task coverage -Devel $env:PHP_DEVEL_DIR -Runtime $env:PHP_RUNTIME
      - name: Upload to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: lcov.info
          version: v11.3.1
          use_oidc: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          fail_ci_if_error: true
