; Show request compile errors and fatal errors in the response body. This setting makes the integration tests independent of the system php.ini.
display_errors = On
display_startup_errors = On
error_reporting = E_ALL
max_execution_time = 0
max_input_time = -1
zend.exception_ignore_args = 0
; Disable session_start() garbage collection. It can report a permission error for the system save_path and cause the cookie tests to fail.
session.gc_probability = 0
