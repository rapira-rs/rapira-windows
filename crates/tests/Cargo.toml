[package]
name = "tests"
version = "0.8.0"
edition = "2024"
publish = false

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
extension_api = { workspace = true }
http = { workspace = true }
php_sys = { workspace = true }
tokio = { workspace = true, features = ["rt", "time"] }
tracing = { workspace = true }
# The capture layer in init_log_capture.
tracing-subscriber = "0.3"

[dev-dependencies]
http-body-util = { workspace = true }
rapira_http = { workspace = true }
rapira_runtime = { workspace = true }
# The streaming end-to-end tests set socket options on a client socket.
socket2 = "0.6"
# The read_slice tests write a temporary file.
tempfile = "3"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
# The end-to-end test harness controls the Rapira process.
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_Threading"] }
# The end-to-end tests check the log format with serde_json.
serde_json = "1"

# The end-to-end suite starts the Rapira binary and sends concurrent requests. The e2e feature excludes this suite from `cargo test --workspace`. Build Rapira first, then run `cargo test -p tests --test e2e --features e2e`.
[features]
e2e = []

[[test]]
name = "e2e"
path = "tests/e2e/main.rs"
required-features = ["e2e"]
