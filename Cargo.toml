[workspace.package]
edition = "2024"

[package]
name = "rapira_windows"
version = "0.9.0"
edition.workspace = true
description = "PHP application server for Windows: embeds ZTS PHP and serves HTTP and gRPC"
homepage = "https://rapira.rs"
documentation = "https://rapira.rs/docs/"
repository = "https://github.com/rapira-rs/rapira-windows"
license = "MIT"
readme = "README.md"

[[bin]]
name = "rapira"
path = "src/main.rs"


[workspace]
members = [
    "crates/config",
    "crates/tests",
    "crates/php_build",
    "crates/middleware/static_files",
    "crates/sapi",
    "crates/scoreboard",
    "crates/net",
    "crates/plugins/http",
    "crates/plugins/grpc",
]

[workspace.dependencies]
anyhow = "1"
base64 = "0.23"
tracing = { version = "0.1", default-features = false, features = ["std"] }
rapira_sapi = { path = "crates/sapi" }
rapira_php_build = { path = "crates/php_build" }
rapira_config = { path = "crates/config" }
rapira_static_files = { path = "crates/middleware/static_files" }
rapira_http = { path = "crates/plugins/http" }
rapira_grpc = { path = "crates/plugins/grpc" }
rapira_net = { path = "crates/net" }
rapira_scoreboard = { path = "crates/scoreboard" }
serde = { version = "1", features = ["derive"] }
toml = "1.1"
tokio = { version = "1", features = ["sync"] }
bytes = "1"
http = "1"
http-body-util = "0.1"
hyper = "1"
hyper-util = "0.1"
tower = { version = "0.5", features = ["util"] }
windows-sys = "0.61"
crossbeam-channel = "0.5"
buffa = { version = "0.9.2", default-features = false, features = ["std"] }
buffa-descriptor = { version = "0.9.2", features = ["reflect", "json"] }
connectrpc = { git = "https://github.com/connectrpc/connect-rust", rev = "0bb21af9736dac7b82065a4252405a8eb65f27ee", default-features = false, features = ["server", "json", "gzip"] }
connectrpc-health = { git = "https://github.com/connectrpc/connect-rust", rev = "0bb21af9736dac7b82065a4252405a8eb65f27ee", default-features = false }
connectrpc-reflection = { git = "https://github.com/connectrpc/connect-rust", rev = "0bb21af9736dac7b82065a4252405a8eb65f27ee", default-features = false }

[workspace.lints.clippy]
all = "warn"

[profile.release]
lto = "thin"
codegen-units = 1

[dependencies]
anyhow = { workspace = true }
clap = { version = "4", features = ["derive"] }
rapira_net = { workspace = true }
rapira_sapi = { workspace = true }
rapira_config = { workspace = true }
rapira_http = { workspace = true }
rapira_grpc = { workspace = true }
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_Threading"] }
rapira_scoreboard = { workspace = true }
mimalloc = "0.1"
serde = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter", "chrono", "json"] }
